name: rust-parity

# Builds the Rust port on Linux and proves it is byte-identical to the bash
# statusline.sh across every theme / style / layout (rust/test-parity.sh).
on:
  pull_request:        # required check on PRs into the default branch
  workflow_dispatch:
  workflow_call:        # invoked as the gate before release.yml builds/publishes

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # run JS actions on Node 24 (clears the Node 20 deprecation notice)

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # use Git Bash on Windows so test-parity.sh runs everywhere
    steps:
      - uses: actions/checkout@v5
      - name: Tooling versions
        run: |
          jq --version
          cargo --version
          bash --version | head -1
      - name: Build (release)
        working-directory: rust
        run: cargo build --release
      - name: Parity vs bash statusline.sh
        working-directory: rust
        run: bash test-parity.sh
