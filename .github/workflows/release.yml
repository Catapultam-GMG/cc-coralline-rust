name: release

# Cut a release by pushing a version tag:  git tag v0.1 && git push origin v0.1
# Builds the binary natively per OS and attaches one archive PER PLATFORM to a
# GitHub Release. macOS x86_64 is cross-built on the arm64 runner (Apple's
# toolchain compiles it natively), so no Intel runner is needed — GitHub removed
# the macos-13 Intel image in Dec 2025. workflow_dispatch builds + uploads run
# artifacts only (no Release), so you can verify the matrix without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build + package each target
        working-directory: rust
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --target "$t"
            case "$t" in
              x86_64-unknown-linux-gnu) label=linux-x86_64; bin=coralline; ext=tar.gz;;
              x86_64-pc-windows-msvc)   label=windows-x86_64; bin=coralline.exe; ext=zip;;
              aarch64-apple-darwin)     label=macos-arm64; bin=coralline; ext=tar.gz;;
              x86_64-apple-darwin)      label=macos-x86_64; bin=coralline; ext=tar.gz;;
              *)                        label="$t"; bin=coralline; ext=tar.gz;;
            esac
            name="cc-coralline-rust-${ver}-${label}"
            cp "target/$t/release/$bin" "dist/$bin"
            if [ "$ext" = "zip" ]; then (cd dist && 7z a "${name}.zip" "$bin" >/dev/null);
            else                        (cd dist && tar czf "${name}.tar.gz" "$bin"); fi
            rm -f "dist/$bin"
          done
          ls -la dist
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: rust/dist/*
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rust/dist/*
          generate_release_notes: true
